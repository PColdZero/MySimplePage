<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인 대시보드</title>
    
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome (아이콘) 로드 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" xintegrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Inter 폰트 설정 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-8">

    <!-- 로고 -->
    <header>
        <img src="/img/PHC GCM Korea_logo.png" alt="PHC GCM Korea 로고" class="header-logo">
    </header>

    <main class="max-w-4xl mx-auto mt-16 sm:mt-8">
        
        <!-- 1. 시계, 날짜 및 카운트다운 -->
        <section class="text-center mb-12">
            <h1 id="clock" class="text-6xl font-bold text-gray-800 mb-2">00:00:00</h1>
            <p id="date" class="text-2xl text-gray-600 mb-8"></p> <!-- 날짜 표시 요소 -->
            <p id="countdown" class="text-xl text-indigo-600 font-medium">퇴근 시간까지 00:00:00 남았습니다.</p>
        </section>

        <!-- 2. 아이콘 링크 -->
        <section class="mb-12">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <a href="mailto:user@example.com" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center p-6 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow">
                    <i class="fas fa-envelope fa-2x text-red-500 mb-2"></i>
                    <span class="text-sm font-medium text-gray-700">Gmail</span>
                </a>
                <a href="https://docs.google.com/spreadsheets/d/1bwZp_myRKwVpvnwLyh7chvJau8_2PMELfvwaDYNgruw/edit?gid=2123551114#gid=2123551114" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center p-6 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow">
                    <i class="fas fa-file-excel fa-2x text-green-500 mb-2"></i>
                    <span class="text-sm font-medium text-gray-700">입출고 관리대장</span>
                </a>
                <a href="https://docs.google.com/presentation/d/1eVu20uaDrMi4ne79CWSAULqthzuVRrWCT8mT_nlExmQ/edit?slide=id.g398bdc9e780_1_17#slide=id.g398bdc9e780_1_17" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center p-6 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow">
                    <i class="fas fa-file-powerpoint fa-2x text-orange-500 mb-2"></i>
                    <span class="text-sm font-medium text-gray-700">부적합 관리대장</span>
                </a>
                <!-- *** 수정된 MES 링크 *** -->
                <a href="http://mes.phcrpm.com:8100/jsp/login.jsp" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center p-6 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow">
                    <!-- <i> 태그 대신 <img> 태그 사용 (업로드한 'mes logo.png' 파일) -->
                    <img src="/img/mes logo.png" alt="MES 아이콘" class="w-10 h-10 object-contain mb-2">
                    <span class="text-sm font-medium text-gray-700">MES</span>
                </a>
            </div>
        </section>

        <!-- 3. 할 일 목록 -->
        <section>
            <div class="bg-white p-6 rounded-lg shadow-sm">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4">Todo List</h2>
                
                <!-- 할 일 추가 폼 -->
                <form id="todo-form" class="mb-6 grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                    <div class="sm:col-span-2">
                        <label for="todo-input" class="block text-sm font-medium text-gray-600 mb-1">새 할 일</label>
                        <input type="text" id="todo-input" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="할 일을 입력하세요..." required>
                    </div>
                    <div>
                        <label for="todo-deadline" class="block text-sm font-medium text-gray-600 mb-1">마감 시간</label>
                        <input type="datetime-local" id="todo-deadline" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center">
                            <input type="checkbox" id="todo-asap" class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                            <label for="todo-asap" class="ml-2 block text-sm font-medium text-gray-700">ASAP (긴급)</label>
                        </div>
                        <button type="submit" class="w-full sm:w-auto px-6 py-2 bg-indigo-600 text-white font-medium rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            추가
                        </button>
                    </div>
                </form>
                
                <!-- 할 일 목록 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-2">할 일</h3>
                        <ul id="todo-list" class="space-y-2">
                            <!-- JS로 동적 생성 -->
                        </ul>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-2">마친 일</h3>
                        <ul id="completed-list" class="space-y-2">
                            <!-- JS로 동적 생성 -->
                        </ul>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- 외부 JavaScript 파일 연결 -->
    <script src="script.js"></script>
</body>
</html>
